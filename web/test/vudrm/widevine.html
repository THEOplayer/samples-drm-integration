<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vudrm Widevine Test</title>
    <link rel="stylesheet" type="text/css" href="/THEOplayer/ui.css">
    <script src="/THEOplayer/THEOplayer.js"></script>
    <script src="/dist/bundle.js"></script>
</head>
<body>
<div id="THEOplayer" class="theoplayer-container video-js theoplayer-skin"></div>
<script type="text/javascript">
    const element = document.querySelector('#THEOplayer');
    const player = new THEOplayer.Player(element, {
        ui: {
            fluid: true
        },
        license: 'license here',
        libraryLocation: '/THEOplayer/'
    });

    THEOplayer.registerContentProtectionIntegration(
        'vudrm',
        'widevine',
        new ContentProtectionIntegrations.VudrmWidevineContentProtectionIntegrationFactory()
    );

    player.source = {
        "sources": [
            {
                "src": "manifest url here",
                "type": "application/dash+xml",
                "lowLatency": false,
                "contentProtection": {
                    "preferredKeySystems": [
                        "widevine"
                    ],
                    "integration": "vudrm",
                    "token": "",
                    "widevine": {
                        "licenseAcquisitionURL": "LA url here"
                    }
                },
                "abr": {
                    "restrictToPlayerSize": false
                }
            }
        ]
    }
</script>
</body>
</html>
